name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          registry-url: https://npm.pkg.github.com
          scope: "@inf-studio"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate skill
        run: node scripts/check-skill.mjs

      - name: Build
        run: pnpm build

      - name: Publish
        # Prerelease versions (semver with a `-suffix`) go to the `next` dist-tag so
        # `latest` always points at a stable release. Stable tags keep publishing to
        # `latest` exactly as before.
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "publishing $VERSION to dist-tag $TAG"
          npm publish --access public --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
